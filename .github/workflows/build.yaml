name: build-shelly-homekit
on:
  push:
    # The companion app doesn't ship in the firmware zips; skip the build (and
    # the feed version bump it causes) when only the app changed.
    paths-ignore:
      - "app/**"
  pull_request:
  workflow_dispatch:
jobs:
  build:
    name: Build ${{ matrix.model }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/markirb/mos:latest
      volumes:
        - /home/runner/work:/home/runner/work
    strategy:
      fail-fast: false
      matrix:
        model:
          - Shelly1
          - Shelly1Gen3
          - Shelly1L
          - Shelly1PM
          - Shelly1PMGen3
          - Shelly2
          - Shelly25
          - Shelly2PMGen3
          - ShellyColorBulb
          - ShellyDuo
          - ShellyI3
          - ShellyI4Gen3
          - ShellyMini1Gen3
          - ShellyMini1PMGen3
          - ShellyPlug
          - ShellyPlugS
          - ShellyPlugSGen3
          - ShellyPlus1
          - ShellyPlus1Mini
          - ShellyPlus1PM
          - ShellyPlus1PMMini
          - ShellyPlus2PM
          - ShellyPlusI4
          - ShellyPlusPlugS
          - ShellyPlusRGBWPM
          - ShellyPlusUni
          - ShellyRGBW2
          - ShellyUNI
          - ShellyVintage
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build
        run: |
          cd /home/runner/work/shelly-homekit/shelly-homekit
          git config --global --add safe.directory /home/runner/work/shelly-homekit/shelly-homekit
          # Auto-increment the patch by the number of commits since the release
          # tag (e.g. 2.16.1 -> 2.16.28), no -latest suffix, so a device reports
          # a plain incrementing version the app's update check can compare.
          BASE=$(sed -n 's/^version: *//p' mos.yml | head -1)
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "$BASE")
          N=$(git rev-list "${TAG}..HEAD" --count 2>/dev/null || echo 0)
          VER="${BASE%.*}.$(( ${BASE##*.} + N ))"
          echo "Building version ${VER}"
          sed -i "s/^version: .*/version: ${VER}/" mos.yml
          make ${{ matrix.model }} LOCAL=1 RELEASE=1
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.model }}
          path: releases/**/shelly-homekit-${{ matrix.model }}.zip
          if-no-files-found: warn
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
           name: all-releases
           pattern: release-*
  deploy-pages:
    name: Publish firmware and update.json to GitHub Pages
    needs: build
    if: github.repository_owner == 'jp-pino' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: zips
      - name: Assemble site
        run: |
          BASE=$(sed -n 's/^version: *//p' mos.yml | head -1)
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "$BASE")
          N=$(git rev-list "${TAG}..HEAD" --count 2>/dev/null || echo 0)
          VERSION="${BASE%.*}.$(( ${BASE##*.} + N ))"
          echo "Version: ${VERSION}"
          export VERSION
          python3 - <<'EOF'
          import glob, json, os, shutil
          version = os.environ["VERSION"]
          base = f"https://jp-pino.github.io/shelly-homekit/{version}"
          os.makedirs(f"site/{version}", exist_ok=True)
          os.makedirs("site/latest", exist_ok=True)
          urls = {}
          for p in sorted(glob.glob("zips/**/shelly-homekit-*.zip", recursive=True)):
              model = os.path.basename(p)[len("shelly-homekit-"):-len(".zip")]
              urls[model] = f"{base}/shelly-homekit-{model}.zip"
              shutil.copy(p, f"site/{version}/shelly-homekit-{model}.zip")
              shutil.copy(p, f"site/latest/shelly-homekit-{model}.zip")
          # Staged like the upstream feed: devices on 2.13+ get this build;
          # anything older must first hop to the 2.13.3 stepping stone
          # (old firmware cannot safely OTA straight to current builds).
          STEP_VER = "2.13.3"
          STEP_OK = ["Shelly1", "Shelly1L", "Shelly1PM", "Shelly2", "Shelly25",
                     "ShellyColorBulb", "ShellyDuo", "ShellyI3", "ShellyMini1Gen3",
                     "ShellyMini1PMGen3", "ShellyPlug", "ShellyPlugS", "ShellyRGBW2",
                     "ShellyUNI", "ShellyVintage"]
          STEP_BLOCKED = ["ShellyPlus1", "ShellyPlus1Mini", "ShellyPlus1PM",
                          "ShellyPlus2PM", "ShellyPlusI4", "ShellyPlusPlugS",
                          "ShellyPlusRGBWPM"]
          step_urls = {m: f"https://rojer.me/files/shelly/{STEP_VER}/shelly-homekit-{m}.zip" for m in STEP_OK}
          step_urls.update({m: "file://invalid" for m in STEP_BLOCKED})
          update = [
              ["2.1[3-9].*", {
                  "version": version,
                  "rel_notes": "https://github.com/jp-pino/shelly-homekit/commits/master",
                  "urls": urls,
              }],
              [".*", {
                  "version": STEP_VER,
                  "rel_notes": f"https://github.com/mongoose-os-apps/shelly-homekit/releases/tag/{STEP_VER}",
                  "urls": step_urls,
              }],
          ]
          with open("site/update.json", "w") as f:
              json.dump(update, f, indent=2)
          import datetime
          def gen_group(m):
              if "Gen3" in m: return "Gen 3"
              if m.startswith("ShellyPlus"): return "Plus (Gen 2)"
              return "Gen 1"
          sections = ""
          for g in ["Gen 1", "Plus (Gen 2)", "Gen 3"]:
              models = sorted(m for m in urls if gen_group(m) == g)
              if not models: continue
              sections += f'<section><h2>{g}</h2><ul class="models">'
              for m in models:
                  sections += (f'<li><span class="name">{m}</span><span class="links">'
                               f'<a href="{version}/shelly-homekit-{m}.zip">{version}</a>'
                               f'<a class="latest" href="latest/shelly-homekit-{m}.zip">latest</a>'
                               '</span></li>')
              sections += "</ul></section>"
          shutil.copy("fs_src/logo.svg", "site/logo.svg")
          commit = os.environ.get("GITHUB_SHA", "")
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          page = (open(".github/pages/index.html").read()
                  .replace("__VERSION__", version)
                  .replace("__COUNT__", str(len(urls)))
                  .replace("__DATE__", now)
                  .replace("__COMMIT_URL__", f"https://github.com/jp-pino/shelly-homekit/commit/{commit}")
                  .replace("__COMMIT__", commit[:7] or "master")
                  .replace("__SECTIONS__", sections))
          with open("site/index.html", "w") as f:
              f.write(page)
          print(f"Published {len(urls)} models as version {version}")
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
