name: build-shelly-homekit
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    name: Build ${{ matrix.model }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/markirb/mos:latest
      volumes:
        - /home/runner/work:/home/runner/work
    strategy:
      fail-fast: false
      matrix:
        model:
          - Shelly1
          - Shelly1Gen3
          - Shelly1L
          - Shelly1PM
          - Shelly1PMGen3
          - Shelly2
          - Shelly25
          - Shelly2PMGen3
          - ShellyColorBulb
          - ShellyDuo
          - ShellyI3
          - ShellyI4Gen3
          - ShellyMini1Gen3
          - ShellyMini1PMGen3
          - ShellyPlug
          - ShellyPlugS
          - ShellyPlugSGen3
          - ShellyPlus1
          - ShellyPlus1Mini
          - ShellyPlus1PM
          - ShellyPlus1PMMini
          - ShellyPlus2PM
          - ShellyPlusI4
          - ShellyPlusPlugS
          - ShellyPlusRGBWPM
          - ShellyPlusUni
          - ShellyRGBW2
          - ShellyUNI
          - ShellyVintage
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build
        run: | 
          cd /home/runner/work/shelly-homekit/shelly-homekit
          git config --global --add safe.directory /home/runner/work/shelly-homekit/shelly-homekit
          make ${{ matrix.model }} LOCAL=1 RELEASE=1 RELEASE_SUFFIX=$(.github/version.py --suffix)
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.model }}
          path: releases/**/shelly-homekit-${{ matrix.model }}.zip
          if-no-files-found: warn
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
           name: all-releases
           pattern: release-*
  deploy-pages:
    name: Publish firmware and update.json to GitHub Pages
    needs: build
    if: github.repository_owner == 'jp-pino' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: zips
      - name: Assemble site
        run: |
          VERSION="$(sed -n 's/^version: *//p' mos.yml)$(.github/version.py --suffix 2>/dev/null || true)"
          echo "Version: ${VERSION}"
          export VERSION
          python3 - <<'EOF'
          import glob, json, os, shutil
          version = os.environ["VERSION"]
          base = f"https://jp-pino.github.io/shelly-homekit/{version}"
          os.makedirs(f"site/{version}", exist_ok=True)
          os.makedirs("site/latest", exist_ok=True)
          urls = {}
          for p in sorted(glob.glob("zips/**/shelly-homekit-*.zip", recursive=True)):
              model = os.path.basename(p)[len("shelly-homekit-"):-len(".zip")]
              urls[model] = f"{base}/shelly-homekit-{model}.zip"
              shutil.copy(p, f"site/{version}/shelly-homekit-{model}.zip")
              shutil.copy(p, f"site/latest/shelly-homekit-{model}.zip")
          # Staged like the upstream feed: devices on 2.13+ get this build;
          # anything older must first hop to the 2.13.3 stepping stone
          # (old firmware cannot safely OTA straight to current builds).
          STEP_VER = "2.13.3"
          STEP_OK = ["Shelly1", "Shelly1L", "Shelly1PM", "Shelly2", "Shelly25",
                     "ShellyColorBulb", "ShellyDuo", "ShellyI3", "ShellyMini1Gen3",
                     "ShellyMini1PMGen3", "ShellyPlug", "ShellyPlugS", "ShellyRGBW2",
                     "ShellyUNI", "ShellyVintage"]
          STEP_BLOCKED = ["ShellyPlus1", "ShellyPlus1Mini", "ShellyPlus1PM",
                          "ShellyPlus2PM", "ShellyPlusI4", "ShellyPlusPlugS",
                          "ShellyPlusRGBWPM"]
          step_urls = {m: f"https://rojer.me/files/shelly/{STEP_VER}/shelly-homekit-{m}.zip" for m in STEP_OK}
          step_urls.update({m: "file://invalid" for m in STEP_BLOCKED})
          update = [
              ["2.1[3-9].*", {
                  "version": version,
                  "rel_notes": "https://github.com/jp-pino/shelly-homekit/commits/master",
                  "urls": urls,
              }],
              [".*", {
                  "version": STEP_VER,
                  "rel_notes": f"https://github.com/mongoose-os-apps/shelly-homekit/releases/tag/{STEP_VER}",
                  "urls": step_urls,
              }],
          ]
          with open("site/update.json", "w") as f:
              json.dump(update, f, indent=2)
          with open("site/index.html", "w") as f:
              f.write(f"<html><body><h1>shelly-homekit {version}</h1><ul>")
              for m, u in urls.items():
                  f.write(f'<li><a href="{u}">{m}</a> (<a href="latest/shelly-homekit-{m}.zip">latest</a>)</li>')
              f.write('</ul><p><a href="update.json">update.json</a></p></body></html>')
          print(f"Published {len(urls)} models as version {version}")
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
