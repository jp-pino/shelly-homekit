<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#232d38"/>
      <stop offset="60%" stop-color="#171b21"/>
      <stop offset="100%" stop-color="#0d1015"/>
    </radialGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c948"/>
      <stop offset="100%" stop-color="#f0a030"/>
    </linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4ad5a"/>
      <stop offset="100%" stop-color="#ec8f2f"/>
    </linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef8538"/>
      <stop offset="100%" stop-color="#d9701f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- stacked layers, diamond orientation -->
  <g transform="rotate(45 512 512)" filter="url(#sh)">
    <rect x="352" y="352" width="360" height="360" rx="86" fill="url(#l3)" transform="translate(56 56)"/>
    <rect x="352" y="352" width="360" height="360" rx="86" fill="url(#l2)" transform="translate(28 28)"/>
    <rect x="352" y="352" width="360" height="360" rx="86" fill="url(#l1)"/>
  </g>

  <!-- HomeKit house cue on the top layer -->
  <g transform="translate(512 486)" stroke="#3a2a12" stroke-width="26"
     stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M -104 6 L 0 -92 L 104 6"/>
    <path d="M -70 -2 L -70 108 L 70 108 L 70 -2"/>
  </g>
</svg>
